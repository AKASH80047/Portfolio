<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="cardGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="shadowP" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGradP)" />
  <circle cx="100" cy="100" r="140" fill="#A855F7" opacity="0.15" />

  <g filter="url(#shadowP)">
    <rect x="250" y="40" width="300" height="420" rx="36" fill="#2E1065" stroke="#7E22CE" stroke-width="4" />
    <rect x="260" y="50" width="280" height="400" rx="28" fill="#1E1B4B" />
    <rect x="350" y="60" width="100" height="12" rx="6" fill="#3B0764" />

    <rect x="275" y="88" width="250" height="70" rx="12" fill="url(#cardGradP)" />
    <text x="295" y="122" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Peblo AI Story Buddy</text>
    <text x="295" y="142" font-family="sans-serif" font-size="11" fill="#E0E7FF">Interactive AI Quiz &amp; Stories</text>

    <!-- Quiz Question Card -->
    <rect x="275" y="170" width="250" height="110" rx="12" fill="#2E1065" stroke="#6366F1" />
    <text x="295" y="198" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C084FC">AI Story Prompt #4</text>
    <text x="295" y="222" font-family="sans-serif" font-size="13" fill="#F8FAFC">"Once upon a time in space..."</text>
    
    <!-- Option buttons -->
    <rect x="295" y="238" width="100" height="28" rx="14" fill="#9333EA" />
    <text x="315" y="256" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Read Story</text>

    <rect x="405" y="238" width="100" height="28" rx="14" fill="#312E81" stroke="#818CF8" />
    <text x="425" y="256" font-family="sans-serif" font-size="11" fill="#C7D2FE">Take Quiz</text>

    <!-- Character illustration badge -->
    <rect x="275" y="292" width="250" height="110" rx="12" fill="#312E81" />
    <circle cx="320" cy="347" r="24" fill="#C084FC" opacity="0.3" />
    <text x="312" y="354" font-family="sans-serif" font-size="20">🤖</text>
    <text x="360" y="340" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">AI Story Generator</text>
    <text x="360" y="360" font-family="sans-serif" font-size="11" fill="#A5B4FC">Flutter + State Management</text>
  </g>
</svg>
