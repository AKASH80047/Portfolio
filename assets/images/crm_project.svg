<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="800" height="500" fill="url(#grid)"/>
  </g>

  <!-- Left Side: Mobile Phone Mockup 1 (Executive Dashboard) -->
  <g transform="translate(180, 40)" filter="url(#glow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="210" height="420" rx="32" fill="#090D16" stroke="url(#phoneBorder)" stroke-width="4"/>
    <!-- Speaker Notch -->
    <rect x="75" y="10" width="60" height="8" rx="4" fill="#1E293B"/>
    
    <!-- Screen Header -->
    <rect x="12" y="32" width="186" height="50" rx="8" fill="#1E293B"/>
    <circle cx="32" cy="57" r="14" fill="#0284C7"/>
    <text x="32" y="61" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AP</text>
    <text x="56" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Enterprise CRM</text>
    <text x="56" y="66" fill="#94A3B8" font-family="sans-serif" font-size="9">Executive View</text>
    
    <!-- KPI Cards Grid -->
    <rect x="12" y="92" width="88" height="60" rx="8" fill="#0284C7" opacity="0.2"/>
    <rect x="12" y="92" width="88" height="60" rx="8" stroke="#0284C7" stroke-width="1.5" fill="none"/>
    <text x="22" y="112" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">Tickets</text>
    <text x="22" y="136" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">142</text>

    <rect x="110" y="92" width="88" height="60" rx="8" fill="#10B981" opacity="0.2"/>
    <rect x="110" y="92" width="88" height="60" rx="8" stroke="#10B981" stroke-width="1.5" fill="none"/>
    <text x="120" y="112" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold">Resolved</text>
    <text x="120" y="136" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">98.4%</text>

    <!-- Chart Block -->
    <rect x="12" y="162" width="186" height="110" rx="8" fill="#1E293B"/>
    <text x="22" y="180" fill="#94A3B8" font-family="sans-serif" font-size="10">Weekly Activity</text>
    <path d="M 22 240 Q 60 210, 100 225 T 180 195" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="180" cy="195" r="4" fill="#38BDF8"/>

    <!-- Module List -->
    <rect x="12" y="282" width="186" height="38" rx="6" fill="#1E293B"/>
    <circle cx="30" cy="301" r="10" fill="#6366F1"/>
    <text x="48" y="305" fill="#FFFFFF" font-family="sans-serif" font-size="10">Attendance Tracker</text>

    <rect x="12" y="328" width="186" height="38" rx="6" fill="#1E293B"/>
    <circle cx="30" cy="347" r="10" fill="#F59E0B"/>
    <text x="48" y="351" fill="#FFFFFF" font-family="sans-serif" font-size="10">Leave Requests</text>

    <!-- Home Indicator -->
    <rect x="75" y="405" width="60" height="4" rx="2" fill="#94A3B8"/>
  </g>

  <!-- Right Side: Mobile Phone Mockup 2 (Tickets & Tasks) -->
  <g transform="translate(420, 60)" filter="url(#glow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="200" height="400" rx="30" fill="#090D16" stroke="#6366F1" stroke-width="3"/>
    <!-- Speaker Notch -->
    <rect x="70" y="8" width="60" height="7" rx="3" fill="#1E293B"/>

    <!-- Screen Header -->
    <text x="16" y="46" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Ticket Desk</text>
    <text x="16" y="60" fill="#94A3B8" font-family="sans-serif" font-size="9">Active Requests (24)</text>

    <!-- Ticket 1 -->
    <rect x="12" y="72" width="176" height="70" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="24" y="92" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">#TK-8042 • High Priority</text>
    <text x="24" y="108" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">API Gateway Timeout</text>
    <text x="24" y="124" fill="#94A3B8" font-family="sans-serif" font-size="9">Assigned to: Akash Pandey</text>

    <!-- Ticket 2 -->
    <rect x="12" y="152" width="176" height="70" rx="8" fill="#1E293B"/>
    <text x="24" y="172" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="bold">#TK-8041 • Resolved</text>
    <text x="24" y="188" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Token Refresh Interceptor</text>
    <text x="24" y="204" fill="#94A3B8" font-family="sans-serif" font-size="9">Latency reduced 30%</text>

    <!-- Ticket 3 -->
    <rect x="12" y="232" width="176" height="70" rx="8" fill="#1E293B"/>
    <text x="24" y="252" fill="#F59E0B" font-family="sans-serif" font-size="10" font-weight="bold">#TK-8039 • In Progress</text>
    <text x="24" y="268" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">FCM Push Notification</text>
    <text x="24" y="284" fill="#94A3B8" font-family="sans-serif" font-size="9">Real-time alerts active</text>

    <!-- Bottom Nav -->
    <rect x="12" y="340" width="176" height="40" rx="20" fill="#1E293B"/>
    <circle cx="45" cy="360" r="12" fill="#0284C7"/>
    <circle cx="100" cy="360" r="12" fill="#334155"/>
    <circle cx="155" cy="360" r="12" fill="#334155"/>
  </g>
</svg>
