<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="cardGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadowA" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGradA)" />
  <circle cx="650" cy="400" r="160" fill="#EC4899" opacity="0.15" />

  <g filter="url(#shadowA)">
    <rect x="250" y="40" width="300" height="420" rx="36" fill="#3B0764" stroke="#D946EF" stroke-width="4" />
    <rect x="260" y="50" width="280" height="400" rx="28" fill="#18181B" />
    <rect x="350" y="60" width="100" height="12" rx="6" fill="#3B0764" />

    <rect x="275" y="88" width="250" height="65" rx="12" fill="url(#cardGradA)" />
    <text x="295" y="122" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Flutter UI &amp; Animation</text>
    <text x="295" y="140" font-family="sans-serif" font-size="11" fill="#FBCFE8">Implicit &amp; Explicit Motion Showcase</text>

    <!-- Animated Card Widget 1 -->
    <rect x="275" y="165" width="250" height="110" rx="12" fill="#27272A" stroke="#EC4899" stroke-width="1.5" />
    <circle cx="315" cy="220" r="24" fill="#F472B6" opacity="0.2" />
    <polygon points="315,202 331,230 299,230" fill="#F472B6" />
    <text x="355" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">Custom Painter</text>
    <text x="355" y="235" font-family="sans-serif" font-size="11" fill="#A1A1AA">60fps Physics Motion</text>

    <!-- Hero Transition Widget 2 -->
    <rect x="275" y="288" width="250" height="110" rx="12" fill="#27272A" stroke="#A855F7" stroke-width="1.5" />
    <rect x="295" y="308" width="40" height="40" rx="8" fill="url(#cardGradA)" />
    <text x="350" y="328" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">Hero Animations</text>
    <text x="350" y="348" font-family="sans-serif" font-size="11" fill="#A1A1AA">Seamless Screen Transitions</text>
  </g>
</svg>
