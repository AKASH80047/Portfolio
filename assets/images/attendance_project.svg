<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Phone Mockup (Employee Attendance System) -->
  <g transform="translate(290, 40)" filter="url(#glow)">
    <rect x="0" y="0" width="220" height="430" rx="32" fill="#090D16" stroke="#F59E0B" stroke-width="4"/>
    <rect x="80" y="10" width="60" height="8" rx="4" fill="#1E293B"/>

    <!-- Screen Header -->
    <text x="20" y="48" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">Attendance Hub</text>
    <text x="20" y="62" fill="#94A3B8" font-family="sans-serif" font-size="9">Wednesday, Aug 12</text>

    <!-- Punch In/Out Circular Button -->
    <circle cx="110" cy="140" r="50" fill="#78350F" stroke="#F59E0B" stroke-width="3"/>
    <text x="110" y="136" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PUNCH OUT</text>
    <text x="110" y="152" fill="#FFFFFF" font-family="sans-serif" font-size="9" text-anchor="middle">In at 09:00 AM</text>

    <!-- GPS Status Pill -->
    <rect x="35" y="202" width="150" height="24" rx="12" fill="#1E293B"/>
    <circle cx="48" cy="214" r="5" fill="#10B981"/>
    <text x="60" y="218" fill="#34D399" font-family="sans-serif" font-size="9">GPS Geofence Verified</text>

    <!-- Shift Summary Card -->
    <rect x="16" y="238" width="188" height="75" rx="10" fill="#1E293B"/>
    <text x="28" y="258" fill="#FBBF24" font-family="sans-serif" font-size="9" font-weight="bold">This Month's Overview</text>

    <text x="28" y="280" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">21 Days</text>
    <text x="28" y="294" fill="#94A3B8" font-family="sans-serif" font-size="9">Present</text>

    <text x="120" y="280" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">0 Leave</text>
    <text x="120" y="294" fill="#94A3B8" font-family="sans-serif" font-size="9">Pending</text>

    <!-- Action Bar -->
    <rect x="16" y="325" width="188" height="38" rx="8" fill="#F59E0B"/>
    <text x="110" y="348" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Apply for Leave +</text>

    <rect x="80" y="415" width="60" height="4" rx="2" fill="#94A3B8"/>
  </g>
</svg>
