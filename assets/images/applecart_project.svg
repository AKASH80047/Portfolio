<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Mobile Phone Mockup (AppleCart E-Commerce) -->
  <g transform="translate(290, 40)" filter="url(#glow)">
    <rect x="0" y="0" width="220" height="430" rx="32" fill="#090D16" stroke="#818CF8" stroke-width="4"/>
    <rect x="80" y="10" width="60" height="8" rx="4" fill="#1E293B"/>

    <!-- App Header -->
    <text x="20" y="48" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">AppleCart 🛒</text>
    <circle cx="190" cy="44" r="14" fill="#312E81"/>
    <text x="190" y="48" fill="#818CF8" font-family="sans-serif" font-size="10" text-anchor="middle">3</text>

    <!-- Search Bar -->
    <rect x="16" y="65" width="188" height="34" rx="17" fill="#1E293B"/>
    <text x="32" y="86" fill="#94A3B8" font-family="sans-serif" font-size="10">Search gadgets, electronics...</text>

    <!-- Category Pills -->
    <rect x="16" y="110" width="55" height="24" rx="12" fill="#6366F1"/>
    <text x="43" y="126" fill="#FFFFFF" font-family="sans-serif" font-size="9" text-anchor="middle">All</text>
    <rect x="77" y="110" width="65" height="24" rx="12" fill="#1E293B"/>
    <text x="109" y="126" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Phones</text>
    <rect x="148" y="110" width="56" height="24" rx="12" fill="#1E293B"/>
    <text x="176" y="126" fill="#94A3B8" font-family="sans-serif" font-size="9" text-anchor="middle">Audio</text>

    <!-- Product Card 1 -->
    <rect x="16" y="146" width="88" height="120" rx="10" fill="#1E293B"/>
    <rect x="24" y="154" width="72" height="50" rx="6" fill="#312E81"/>
    <text x="60" y="184" fill="#A5B4FC" font-family="sans-serif" font-size="14" text-anchor="middle">📱</text>
    <text x="24" y="216" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold">iPhone 15 Pro</text>
    <text x="24" y="230" fill="#818CF8" font-family="sans-serif" font-size="10" font-weight="bold">$999</text>
    <circle cx="86" cy="248" r="10" fill="#6366F1"/>
    <text x="86" y="252" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">+</text>

    <!-- Product Card 2 -->
    <rect x="116" y="146" width="88" height="120" rx="10" fill="#1E293B"/>
    <rect x="124" y="154" width="72" height="50" rx="6" fill="#312E81"/>
    <text x="160" y="184" fill="#A5B4FC" font-family="sans-serif" font-size="14" text-anchor="middle">🎧</text>
    <text x="124" y="216" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="bold">AirPods Max</text>
    <text x="124" y="230" fill="#818CF8" font-family="sans-serif" font-size="10" font-weight="bold">$549</text>
    <circle cx="186" cy="248" r="10" fill="#6366F1"/>
    <text x="186" y="252" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">+</text>

    <!-- Shopping Cart Riverpod Drawer Preview -->
    <rect x="16" y="280" width="188" height="90" rx="10" fill="#312E81" stroke="#818CF8" stroke-width="1"/>
    <text x="28" y="300" fill="#A5B4FC" font-family="sans-serif" font-size="10" font-weight="bold">Riverpod Live Cart State</text>
    <text x="28" y="320" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">Total: $1,548.00</text>
    <rect x="28" y="332" width="164" height="26" rx="13" fill="#6366F1"/>
    <text x="110" y="349" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Proceed to Checkout →</text>

    <rect x="80" y="415" width="60" height="4" rx="2" fill="#94A3B8"/>
  </g>
</svg>
