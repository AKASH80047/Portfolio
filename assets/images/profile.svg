<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#glowGrad)" stroke-width="4" filter="url(#dropShadow)" />
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="175" fill="url(#bgGrad)"/>
  
  <!-- Tech Pattern Backdrop -->
  <g opacity="0.15">
    <path d="M 50,200 L 350,200 M 200,50 L 200,350" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 8"/>
    <circle cx="200" cy="200" r="120" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
  
  <!-- Developer Avatar Silhouette & Styling -->
  <g filter="url(#dropShadow)">
    <!-- Shoulders / Jacket -->
    <path d="M 100,340 C 100,270 140,240 200,240 C 260,240 300,270 300,340 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 160,245 L 200,310 L 240,245 Z" fill="#0F172A"/>
    
    <!-- Neck -->
    <rect x="180" y="210" width="40" height="40" rx="8" fill="#F8FAFC" opacity="0.9"/>
    
    <!-- Head -->
    <path d="M 140,160 C 140,105 165,90 200,90 C 235,90 260,105 260,160 C 260,200 235,225 200,225 C 165,225 140,200 140,160 Z" fill="#E2E8F0"/>
    
    <!-- Hair -->
    <path d="M 135,150 C 135,100 160,80 200,80 C 240,80 265,100 265,150 C 265,130 250,90 200,90 C 150,90 135,130 135,150 Z" fill="#0F172A"/>
    
    <!-- Modern Glasses -->
    <rect x="155" y="140" width="38" height="26" rx="6" fill="none" stroke="#0F172A" stroke-width="4"/>
    <rect x="207" y="140" width="38" height="26" rx="6" fill="none" stroke="#0F172A" stroke-width="4"/>
    <line x1="193" y1="150" x2="207" y2="150" stroke="#0F172A" stroke-width="4"/>
    
    <!-- Flutter Logo Accent Badge -->
    <g transform="translate(180, 270) scale(0.8)">
      <path d="M0,25 L15,40 L30,25 L15,10 Z" fill="#47D5C0"/>
      <path d="M15,40 L30,55 L45,40 L30,25 Z" fill="#02569B"/>
      <path d="M15,10 L35,-10 L45,-10 L25,10 Z" fill="#0175C2"/>
    </g>
  </g>
</svg>
