<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Phone Mockup (Online Examination System) -->
  <g transform="translate(290, 40)" filter="url(#glow)">
    <rect x="0" y="0" width="220" height="430" rx="32" fill="#090D16" stroke="#10B981" stroke-width="4"/>
    <rect x="80" y="10" width="60" height="8" rx="4" fill="#1E293B"/>

    <!-- Screen Header -->
    <text x="20" y="48" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">AI Quiz & Exam</text>
    <rect x="130" y="34" width="70" height="22" rx="11" fill="#065F46"/>
    <text x="165" y="49" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">⏱ 14:22</text>

    <!-- Question Box -->
    <rect x="16" y="70" width="188" height="90" rx="10" fill="#1E293B" stroke="#059669" stroke-width="1"/>
    <text x="28" y="90" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="bold">Question 4 of 20</text>
    <text x="28" y="110" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">What is the primary role of</text>
    <text x="28" y="124" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">Riverpod in Flutter?</text>

    <!-- Option 1 -->
    <rect x="16" y="172" width="188" height="38" rx="8" fill="#1E293B"/>
    <circle cx="34" cy="191" r="8" fill="#334155"/>
    <text x="50" y="195" fill="#94A3B8" font-family="sans-serif" font-size="10">Database Caching</text>

    <!-- Option 2 (Selected Correct) -->
    <rect x="16" y="218" width="188" height="38" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="34" cy="237" r="8" fill="#10B981"/>
    <text x="50" y="241" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold">Compile-Safe State Management</text>

    <!-- Option 3 -->
    <rect x="16" y="264" width="188" height="38" rx="8" fill="#1E293B"/>
    <circle cx="34" cy="283" r="8" fill="#334155"/>
    <text x="50" y="287" fill="#94A3B8" font-family="sans-serif" font-size="10">HTTP Network Parsing</text>

    <!-- Navigation Buttons -->
    <rect x="16" y="320" width="85" height="34" rx="6" fill="#1E293B"/>
    <text x="58" y="341" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">← Previous</text>

    <rect x="119" y="320" width="85" height="34" rx="6" fill="#10B981"/>
    <text x="161" y="341" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Next →</text>

    <rect x="80" y="415" width="60" height="4" rx="2" fill="#94A3B8"/>
  </g>
</svg>
